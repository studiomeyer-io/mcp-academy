name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke

  # Eigener Job auf aktuellem Node: `npm audit` prueft das Lockfile, nicht die
  # Node-Version, und braucht es deshalb nur einmal. Node 20 bringt ein npm mit,
  # das noch den alten Schnell-Endpunkt anspricht ("This endpoint is being
  # retired"); der antwortet nach rund sechs Minuten mit 400 und liess den
  # Lauf scheitern, ohne dass ein einziger Fund vorlag.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
